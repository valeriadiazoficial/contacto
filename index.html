<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valeria Diaz Oficial | Contacto</title>
    
    <!-- Open Graph para WhatsApp y Redes Sociales -->
    <meta property="og:title" content="Valeria Diaz | Contacto Oficial">
    <meta property="og:description" content="Escríbeme directo al WhatsApp o Telegram. Atencion personalizada y verificada.">
    <meta property="og:image" content="https://valeriadiazoficial.github.io/contacto/diseno.jpg">
    <meta property="og:url" content="https://valeriadiazoficial.github.io/contacto">
    <meta property="og:type" content="website">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000 url('diseno.jpg') no-repeat center center / cover;
            position: relative;
        }

        /* EFECTO DE DIFUMINADO EN LA FOTO DE FONDO */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 1;
        }

        /* Contenedor principal centrado */
        .main-container {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Tarjeta central: transparencia alta y difuminado muy bajo */
        .profile-card {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 25px 20px;
            width: 100%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
        }

        /* Foto de perfil SIN MARCO BLANCO */
        .avatar-container {
            width: 85px;
            height: 85px;
            margin: 0 auto 12px auto;
            border-radius: 50%;
            overflow: hidden;
            border: none;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
        }

        .avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .name-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            margin-bottom: 4px;
        }

        .name-container h1 {
            color: #fff;
            font-size: 21px;
            font-weight: 700;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
        }

        /* CHECK DE VERIFICACIÓN ESTILO INSTAGRAM */
        .verified-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 18px;
            height: 18px;
            color: #0095f6;
            flex-shrink: 0;
            filter: drop-shadow(0 1px 2px rgba(0,0,0,0.5));
        }

        .verified-badge svg {
            width: 100%;
            height: 100%;
            fill: currentColor;
        }

        /* ESTILO PARA LA BIO EN DOS LÍNEAS */
        .bio {
            color: rgba(255, 255, 255, 0.95);
            font-size: 13.5px;
            margin-bottom: 20px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.6);
            line-height: 1.4;
        }

        .bio span {
            display: block;
        }

        /* ANIMACIÓN DE BRILLO TIPO OLA / COMPRA Y LATIDO */
        @keyframes shineWave {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        @keyframes pulseGlow {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        .btn-contacto {
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 13px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            margin-bottom: 12px;
            border: none;
            cursor: pointer;
            animation: pulseGlow 2.5s infinite ease-in-out;
            transition: transform 0.1s ease;
            background-size: 200% 100%;
        }

        .btn-contacto::after {
            content: '';
            position: absolute;
            top: 0; left: -150%;
            width: 150%; height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.35),
                transparent
            );
            transform: skewX(-20deg);
            animation: shineSweep 3s infinite linear;
        }

        @keyframes shineSweep {
            0% { left: -150%; }
            20% { left: 150%; }
            100% { left: 150%; }
        }

        .btn-contacto:active {
            transform: scale(0.95);
        }

        .whatsapp {
            background-color: #25d366;
            color: #fff;
            animation-delay: 0s;
        }

        .telegram {
            background-color: #0088cc;
            color: #fff;
            animation-delay: 0.8s;
        }

        .btn-fotos {
            background: rgba(20, 20, 20, 0.9);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            animation-delay: 1.6s;
        }

        .btn-icon {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        /* NOTIFICACIONES FLOTANTES TIPO IOS SIN LATENCIA (APARICIÓN INSTANTÁNEA) */
        .ios-notification {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-120px);
            width: 90%;
            max-width: 350px;
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 12px 16px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 10;
            opacity: 0;
            transition: transform 0.15s ease-out, opacity 0.15s ease-out;
            pointer-events: none;
            will-change: transform, opacity;
        }

        .ios-notification.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .notif-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .notif-content {
            flex-grow: 1;
        }

        .notif-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3px;
        }

        .notif-title {
            color: #fff;
            font-size: 13px;
            font-weight: 600;
        }

        .notif-time {
            color: rgba(255, 255, 255, 0.5);
            font-size: 11px;
        }

        .notif-body {
            color: rgba(255, 255, 255, 0.95);
            font-size: 12.5px;
            line-height: 1.3;
        }

        .notif-stars {
            color: #ffc107;
            font-size: 11px;
            margin-top: 2px;
        }

        /* MINI VENTANA EMERGENTE (TOAST MINIATURA) PARA COPIA DE NÚMERO */
        .copy-toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-80px);
            background: rgba(15, 15, 15, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #fff;
            padding: 10px 18px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 500;
            z-index: 300;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            opacity: 0;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
            pointer-events: none;
            text-align: center;
        }

        .copy-toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .location-footer {
            margin-top: 10px;
            color: rgba(255, 255, 255, 0.9);
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        /* VENTANA DESLIZANTE DE CATÁLOGO */
        .catalog-drawer {
            position: fixed;
            top: 0;
            right: -100%;
            width: 100%;
            max-width: 380px;
            height: 100%;
            background: rgba(15, 15, 15, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 100;
            box-shadow: -10px 0 30px rgba(0,0,0,0.8);
            transition: right 0.4s cubic-bezier(0.1, 0.9, 0.2, 1);
            display: flex;
            flex-direction: column;
        }

        .catalog-drawer.open {
            right: 0;
        }

        .catalog-header {
            padding: 18px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .catalog-title {
            color: #fff;
            font-size: 17px;
            font-weight: 600;
        }

        .close-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: #fff;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .catalog-body {
            padding: 15px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            flex-grow: 1;
        }

        .catalog-item {
            aspect-ratio: 4/5;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.05);
            cursor: pointer;
            position: relative;
        }

        .catalog-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .catalog-item:hover img {
            transform: scale(1.05);
        }

        /* MODAL DE FOTO AMPLIADA / CHECKOUT DE CONTENIDO Y CITAS */
        .photo-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.92);
            z-index: 200;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .photo-modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content-wrapper {
            max-width: 340px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-img {
            width: 100%;
            max-height: 40vh;
            object-fit: contain;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.2);
            cursor: zoom-in;
            transition: transform 0.3s ease;
        }

        /* MINI CUADRADO DE DESCRIPCIÓN DE CONTENIDO Y CITAS */
        .checkout-box {
            background: rgba(25, 25, 25, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 14px;
            padding: 15px;
            width: 100%;
            color: #fff;
            text-align: left;
            font-size: 13px;
            line-height: 1.5;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .checkout-box h3 {
            font-size: 15px;
            margin-bottom: 8px;
            text-align: center;
            color: #ffc107;
        }

        .checkout-box ul {
            list-style: none;
            padding: 0;
            margin-bottom: 10px;
        }

        .checkout-box li {
            padding: 2px 0;
            font-size: 13px;
        }

        .checkout-box .price-tag {
            text-align: center;
            font-weight: bold;
            font-size: 14.5px;
            color: #25d366;
            margin-top: 8px;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 6px;
        }

        .checkout-box .cita-text {
            white-space: pre-line;
            font-size: 13px;
            text-align: center;
            color: rgba(255,255,255,0.95);
            line-height: 1.4;
        }

        /* BOTONES DE PAGO Y ACCIÓN */
        .btn-comprar {
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 12px;
            background-color: #111111;
            color: #fff;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14.5px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.25);
            cursor: pointer;
            animation: pulseGlow 2s infinite ease-in-out;
            background-size: 200% 100%;
        }

        .btn-yape {
            background-color: #742284 !important;
        }

        .btn-plin {
            background-color: #00a1c9 !important;
        }

        .btn-comprobar {
            background-color: #25d366 !important;
            font-size: 13.5px;
        }

        .btn-comprar::after {
            content: '';
            position: absolute;
            top: 0; left: -150%;
            width: 150%; height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.4),
                transparent
            );
            transform: skewX(-20deg);
            animation: shineSweep 2.5s infinite linear;
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.2);
            border: none;
            color: #fff;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            z-index: 201;
        }
    </style>
</head>

    <audio id="notifSound" preload="auto">
