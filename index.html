<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valeria Diaz | Contacto Oficial</title>
  <style>
    /* Estilos generales y fluidos */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: #0b0b0b;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, rgba(255,255,255,0.05) 0%, transparent 70%);
      pointer-events: none;
    }

    /* Tarjeta central ultra transparente */
    .main-card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 30px 20px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      z-index: 10;
      margin: 20px;
    }

    /* Ubicación superior e inferior */
    .location-text {
      font-size: 12px;
      letter-spacing: 1.5px;
      color: rgba(255, 255, 255, 0.6);
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .location-bottom {
      margin-top: 15px;
      margin-bottom: 0;
    }

    /* Foto de perfil sin marco */
    .profile-img-container {
      width: 110px;
      height: 110px;
      margin: 0 auto 15px auto;
      border-radius: 50%;
      overflow: hidden;
    }

    .profile-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .profile-name {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 20px;
      letter-spacing: 0.5px;
    }

    .links-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Animaciones constantes de latido y onda shimmer */
    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }

    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    .action-btn {
      position: relative;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: white;
      padding: 14px 20px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      animation: heartbeat 2s infinite ease-in-out;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .action-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.3);
    }

    .action-btn::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      animation: shimmer 3s infinite;
    }

    /* Catálogo lateral deslizable y compacto */
    .catalog-drawer {
      position: fixed;
      right: -320px;
      top: 0;
      width: 280px;
      height: 100%;
      background: rgba(15, 15, 15, 0.96);
      backdrop-filter: blur(16px);
      z-index: 1000;
      transition: right 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      padding: 20px;
      box-shadow: -10px 0 30px rgba(0,0,0,0.7);
      overflow-y: auto;
      text-align: left;
      border-left: 1px solid rgba(255,255,255,0.1);
    }

    .catalog-drawer.active {
      right: 0;
    }

    .catalog-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .catalog-header h3 {
      font-size: 11px;
      letter-spacing: 1px;
      color: rgba(255,255,255,0.7);
    }

    .close-drawer {
      background: none;
      border: none;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px; /* Muy juntas y compactas */
    }

    .catalog-item {
      width: 100%;
      aspect-ratio: 1/1;
      object-fit: cover;
      border-radius: 6px;
      cursor: pointer;
      transition: transform 0.2s ease, filter 0.2s ease;
    }

    .catalog-item:hover {
      transform: scale(1.04);
      filter: brightness(1.15);
    }

    /* Visor Modal con Zoom */
    .photo-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.92);
      z-index: 2000;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      padding: 20px;
    }

    .photo-modal.active {
      display: flex;
    }

    .close-modal-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(255,255,255,0.1);
      border: none;
      color: white;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      font-size: 20px;
      cursor: pointer;
    }

    .modal-content-wrapper {
      max-width: 90%;
      max-height: 65vh;
      text-align: center;
      position: relative;
      overflow: hidden;
      border-radius: 12px;
    }

    .modal-img {
      width: 100%;
      height: auto;
      max-height: 60vh;
      object-fit: contain;
      transition: transform 0.3s ease;
      cursor: zoom-in;
      border-radius: 8px;
    }

    .modal-img.zoomed {
      transform: scale(1.8);
      cursor: zoom-out;
    }
