<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Valeria Diaz | Contacto</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }

        .page-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
        }

        .page-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Zonas táctiles invisibles para los botones */
        .interactive-link {
            position: absolute;
            left: 18%;
            width: 64%;
            height: 7.5%;
            cursor: pointer;
            background: transparent;
            border: none;
            outline: none;
        }

        /* Botón de WhatsApp con protocolo nativo para abrir la App de frente */
        .btn-wa {
            top: 57.5%;
        }

        /* Botón de Telegram */
        .btn-tg {
            top: 66.5%;
        }
    </style>
</head>
<body>

    <div class="page-container">
        <!-- Tu imagen de diseño -->
        <img src="diseno.jpg" alt="Valeria Diaz - Contacto">

        <!-- Enlace nativo para abrir la App de WhatsApp directamente -->
        <a href="whatsapp://send?phone=51999894839&text=Hola%20informacion%20%3F%20%F0%9F%99%88" 
           class="interactive-link btn-wa"></a>

        <!-- Enlace a Telegram -->
        <a href="https://t.me/valerydia" 
           class="interactive-link btn-tg" 
           target="_blank" 
           rel="noopener noreferrer"></a>
    </div>

</body>
</html>
