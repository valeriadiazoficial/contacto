<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valeria Diaz | Contacto Directo</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #000;
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .page-container {
            position: relative;
            width: 100%;
            max-width: 420px;
            aspect-ratio: 9/16;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .page-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .interactive-link {
            position: absolute;
            left: 10%;
            width: 80%;
            height: 9%;
            border-radius: 50px;
            cursor: pointer;
            background: transparent;
        }
        .btn-wa { top: 57.5%; }
        .btn-tg { top: 68.5%; }
    </style>
</head>
<body>
    <div class="page-container">
        <!-- Asegúrate de que tu imagen se llame exactamente 'diseno.jpg' -->
        <img src="diseno.jpg" alt="Valeria Diaz - Contacto">

        <!-- Enlace WhatsApp con mensaje automático -->
        <a href="https://wa.me/51999894839?text=Hola%20informacion%20%3F%20%F0%9F%99%88" 
           class="interactive-link btn-wa" 
           target="_blank"></a>

        <!-- Enlace Telegram -->
        <a href="https://t.me/valery_dia" 
           class="interactive-link btn-tg" 
           target="_blank"></a>
    </div>
</body>
