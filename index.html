<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valeria Diaz Oficial | Contacto</title>
    
    <!-- Open Graph para WhatsApp y Redes Sociales -->
    <meta property="og:title" content="Valeria Diaz | Contacto Oficial">
    <meta property="og:description" content="Escríbeme directo al WhatsApp o Telegram. Atencion personalizada y verificada.">
    <meta property="og:image" content="https://valeriadiazoficial.github.io/contacto/diseno.jpg">
    <meta property="og:url" content="https://valeriadiazoficial.github.io/contacto">
    <meta property="og:type" content="website">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000 url('diseno.jpg') no-repeat center center / cover;
            position: relative;
        }

        /* Overlay muy sutil para dejar ver el fondo */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.25);
            z-index: 1;
        }

        /* Contenedor principal centrado */
        .main-container {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Tarjeta central */
        .profile-card {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 25px 20px;
            width: 100%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
        }

        /* Foto de perfil SIN MARCO */
        .avatar-container {
            width: 85px;
            height: 85px;
            margin: 0 auto 10px auto;
            border-radius: 50%;
            overflow: hidden;
            border: none;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
        }

        .avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .name-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            margin-bottom: 2px;
        }

        .name-container h1 {
            color: #fff;
            font-size: 21px;
            font-weight: 700;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
        }

        .verified-badge {
            color: #1d9bf0;
            font-size: 17px;
        }

        .location-header {
            color: rgba(255, 255, 255, 0.9);
            font-size: 12px;
            margin-bottom: 8px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.6);
        }

        .bio {
            color: rgba(255, 255, 255, 0.95);
            font-size: 13.5px;
            margin-bottom: 18px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.6);
        }

        /* ANIMACIÓN DE BRILLO TIPO OLA Y LATIDO */
        @keyframes pulseGlow {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        @keyframes shineSweep {
            0% { left: -150%; }
            20% { left: 150%; }
            100% { left: 150%; }
        }

        .btn-contacto {
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 13px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            margin-bottom: 12px;
            border: none;
            cursor: pointer;
            animation: pulseGlow 2.5s infinite ease-in-out;
            transition: transform 0.1s ease;
        }

        .btn-contacto::after {
            content: '';
            position: absolute;
            top: 0; left: -150%;
            width: 150%; height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.35),
                transparent
            );
            transform: skewX(-20deg);
            animation: shineSweep 3s infinite linear;
        }

        .btn-contacto:active {
            transform: scale(0.95);
        }

        .whatsapp {
            background-color: #25d366;
            color: #fff;
            animation-delay: 0s;
        }

        .telegram {
            background-color: #0088cc;
            color: #fff;
            animation-delay: 0.8s;
        }

        .btn-fotos {
            background: rgba(20, 20, 20, 0.9);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            animation-delay: 1.6s;
        }

        .btn-icon {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .location-footer {
            margin-top: 5px;
            color: rgba(255, 255, 255, 0.9);
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        /* NOTIFICACIONES FLOTANTES TIPO IOS */
        .ios-notification {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            width: 90%;
            max-width: 350px;
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 12px 16px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 10;
            opacity: 0;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.2s ease;
            pointer-events: none;
        }

        .ios-notification.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .notif-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .notif-content {
            flex-grow: 1;
        }

        .notif-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3px;
        }

        .notif-title {
            color: #fff;
            font-size: 13px;
            font-weight: 600;
        }

        .notif-time {
            color: rgba(255, 255, 255, 0.5);
            font-size: 11px;
        }

        .notif-body {
            color: rgba(255, 255, 255, 0.95);
            font-size: 12.5px;
            line-height: 1.3;
        }

        .notif-stars {
            color: #ffc107;
            font-size: 11px;
            margin-top: 2px;
        }

        /* VENTANA DESLIZANTE DE CATÁLOGO (MÁS JUNTO Y COMPACTO) */
        .catalog-drawer {
            position: fixed;
            top: 0;
            right: -100%;
            width: 100%;
            max-width: 400px;
            height: 100%;
            background: rgba(15, 15, 15, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 100;
            box-shadow: -10px 0 30px rgba(0,0,0,0.8);
            transition: right 0.4s cubic-bezier(0.1, 0.9, 0.2, 1);
            display: flex;
